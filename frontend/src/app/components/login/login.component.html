<form class="text-box" (ngSubmit)="login()" #loginForm="ngForm">
  <div class="form-group">
    <label for="email">Correo Electrónico</label>
    <div class="input-icon">
      <i class="fas fa-envelope"></i>
      <input
        type="email"
        id="email"
        name="email"
        class="form-control input-estilo"
        placeholder="ejemplo@correo.com"
        required
        [(ngModel)]="email"
        #emailRef="ngModel"
      >
    </div>
    <div *ngIf="emailRef.invalid && emailRef.touched" class="text-danger">
      Correo es requerido y debe ser válido.
    </div>
  </div>

  <div class="form-group mb-4">
    <label for="password">Contraseña</label>
    <input
      type="password"
      id="password"
      name="password"
      class="form-control input-estilo"
      placeholder="Ingresa tu contraseña"
      required
      [(ngModel)]="password"
      #passwordRef="ngModel"
    >
    <div *ngIf="passwordRef.invalid && passwordRef.touched" class="text-danger">
      La contraseña es requerida.
    </div>
  </div>

  <!-- Mensajes de éxito o error -->
  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div class="text-center">
    <button type="submit" class="btn btn-registro" [disabled]="loginForm.invalid">
      Ingresar
    </button>
  </div>
</form>
