<section class="form-section">
  <div class="form-container">
    <div class="highlight-box">
      <h3>Iniciar Sesión</h3>
    </div>
    <form class="text-box" (ngSubmit)="login()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-icon">
          <i class="fas fa-envelope"></i>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control input-estilo"
            placeholder="ejemplo@correo.com"
            required
            [(ngModel)]="email"
            #emailRef="ngModel"
            [ngClass]="{'is-invalid': emailRef.invalid && emailRef.touched}"
          />
        </div>
        <div *ngIf="emailRef.invalid && emailRef.touched" class="error-message">
          Correo es requerido y debe ser válido.
        </div>
      </div>

      <div class="form-group mb-4">
        <label for="password">Contraseña</label>
        <div class="input-icon">
          <i class="fas fa-lock"></i>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            class="form-control input-estilo"
            placeholder="Ingresa tu contraseña"
            required
            [(ngModel)]="password"
            #passwordRef="ngModel"
            [ngClass]="{'is-invalid': passwordRef.invalid && passwordRef.touched}"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            aria-label="Mostrar/Ocultar contraseña"
          >
            <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <div *ngIf="passwordRef.invalid && passwordRef.touched" class="error-message">
          La contraseña es requerida.
        </div>
      </div>

      <!-- Mensajes de éxito o error -->
      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
      </div>
      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <div class="text-center">
        <button
          type="submit"
          class="btn btn-registro"
          [disabled]="loginForm.invalid || loading"
        >
          <span *ngIf="loading" class="spinner"></span>
          {{ loading ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </div>

      <p class="register-link">
        ¿No tienes una cuenta? <a routerLink="/registro">Regístrate aquí</a>
      </p>
    </form>
  </div>
</section>
