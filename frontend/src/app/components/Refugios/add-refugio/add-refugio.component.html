<div class="form-container">
  <div class="form-card">
    <div class="form-header">
      <h2 class="form-title">{{opcion}}</h2>
      <div class="form-icon">
        <i class="fas fa-paw"></i>
      </div>
    </div>
  
    <form (ngSubmit)="onSubmit()" #formRef="ngForm" class="refugio-form">
      <!-- Grupo Nombre -->
      <div class="form-group">
        <label class="form-label">
          <i class="fas fa-home label-icon"></i>
          Nombre del refugio
        </label>
        <input type="text" class="form-input" required [(ngModel)]="refugio.nombre" name="nombre" placeholder="Ej: Refugio Patitas Felices" />
      </div>

      <!-- Grupo Dirección -->
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">
            <i class="fas fa-map-marker-alt label-icon"></i>
            Dirección
          </label>
          <input type="text" class="form-input" [(ngModel)]="refugio.ubicacion" name="ubicacion" placeholder="Ej: Calle Principal #123" />
        </div>
      </div>

      <!-- Grupo Email -->
      <div class="form-group">
        <label class="form-label">
          <i class="fas fa-envelope label-icon"></i>
          Correo electrónico
        </label>
        <input type="email" class="form-input" [(ngModel)]="refugio.email" name="email" placeholder="Ej: contacto@refugio.com" />
      </div>

      <!-- Grupo Teléfono -->
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">
            <i class="fas fa-phone label-icon"></i>
            Teléfono
          </label>
          <input type="tel" class="form-input" [(ngModel)]="refugio.telefono" name="telefono" placeholder="Ej: ‪+51 987654321‬" />
        </div>
      </div>

      <!-- Botón de Submit -->
      <button type="submit" class="submit-btn">
        <i class="fas fa-paper-plane btn-icon"></i>
        {{btnEnvEdit.mensaje}}
      </button>
    </form>
  </div>
</div>
