<section class="form-section">
  <div class="form-container">
    <div class="highlight-box">
      <h3>Crear Cuenta</h3>
    </div>
    <form (ngSubmit)="registrarUsuario()" #form="ngForm" class="text-box">
      
      <!-- Nombre Completo -->
      <div class="form-group">
        <label for="nombreCompleto">Nombre Completo</label>
        <input
          type="text"
          id="nombreCompleto"
          name="nombreCompleto"
          class="form-control input-estilo"
          placeholder="Tu nombre completo"
          [(ngModel)]="nombreCompleto"
          required
          minlength="3"
          #nombreInput="ngModel"
          [ngClass]="{'is-invalid': nombreInput.invalid && nombreInput.touched}"
        />
        <div *ngIf="nombreInput.invalid && nombreInput.touched" class="error-message">
          Por favor, ingresa tu nombre completo (mínimo 3 caracteres).
        </div>
      </div>

      <!-- Correo Electrónico -->
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control input-estilo"
          placeholder="ejemplo@correo.com"
          [(ngModel)]="email"
          required
          email
          #emailInput="ngModel"
          [ngClass]="{'is-invalid': emailInput.invalid && emailInput.touched}"
        />
        <div *ngIf="emailInput.invalid && emailInput.touched" class="error-message">
          Por favor, ingresa un correo válido.
        </div>
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            class="form-control input-estilo"
            placeholder="Ingresa una contraseña"
            [(ngModel)]="password"
            required
            minlength="6"
            #passwordInput="ngModel"
            [ngClass]="{'is-invalid': passwordInput.invalid && passwordInput.touched}"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            aria-label="Mostrar/Ocultar contraseña"
          >
            <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <div *ngIf="passwordInput.invalid && passwordInput.touched" class="error-message">
          La contraseña debe tener al menos 6 caracteres.
        </div>
      </div>

      <!-- Teléfono (opcional) -->
      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input
          type="tel"
          id="telefono"
          name="telefono"
          class="form-control input-estilo"
          placeholder="Ejemplo: +57 300 1234567"
          [(ngModel)]="telefono"
          pattern="^[+]?[\d\s\-]{7,15}$"
          #telefonoInput="ngModel"
          [ngClass]="{'is-invalid': telefonoInput.invalid && telefonoInput.touched}"
        />
        <div *ngIf="telefonoInput.invalid && telefonoInput.touched" class="error-message">
          Ingresa un número de teléfono válido.
        </div>
      </div>

      <!-- Dirección (opcional) -->
      <div class="form-group">
        <label for="direccion">Dirección</label>
        <input
          type="text"
          id="direccion"
          name="direccion"
          class="form-control input-estilo"
          placeholder="Tu dirección"
          [(ngModel)]="direccion"
        />
      </div>

      <!-- Rol (oculto o select si quieres que el usuario elija) -->
      <!-- Puedes ocultarlo si siempre quieres rol 'user' -->
      <input type="hidden" name="rol" [(ngModel)]="rol" />

      <div class="text-center">
        <button
          type="submit"
          class="btn btn-registro"
          [disabled]="form.invalid"
        >
          Registrar
        </button>
      </div>

      <p class="login-link">
        ¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a>
      </p>
    </form>
  </div>
</section>
