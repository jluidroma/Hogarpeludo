<div class="form-container">
  <h2 class="form-title">{{opcion}}</h2>

  <form (ngSubmit)="onSubmit()" #formVoluntario="ngForm" class="volunteer-form">
    
    <div class="form-grid">
      <!-- Grupo Nombre -->
      <div class="form-group">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-input" required [(ngModel)]="voluntario.nombre" name="nombre" 
               placeholder="Ingrese su nombre" />
        <span class="input-icon"><i class="fas fa-user"></i></span>
      </div>
      
      <!-- Grupo Apellido -->
      <div class="form-group">
        <label class="form-label">Apellido</label>
        <input type="text" class="form-input" required [(ngModel)]="voluntario.apellido" name="apellido" 
               placeholder="Ingrese su apellido" />
        <span class="input-icon"><i class="fas fa-user"></i></span>
      </div>
    </div>

    <div class="form-grid">
      <!-- Grupo Email -->
      <div class="form-group">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" class="form-input" required [(ngModel)]="voluntario.email" name="email" 
               placeholder="ejemplo@correo.com" />
        <span class="input-icon"><i class="fas fa-envelope"></i></span>
      </div>
      
      <!-- Grupo Teléfono -->
      <div class="form-group">
        <label class="form-label">Teléfono</label>
        <input type="tel" class="form-input" required [(ngModel)]="voluntario.telefono" name="telefono" 
               placeholder="Ingrese su teléfono" />
        <span class="input-icon"><i class="fas fa-phone"></i></span>
      </div>
    </div>

    <!-- Grupo Disponibilidad -->
    <div class="form-group">
      <label class="form-label">Disponibilidad</label>
      <div class="select-wrapper">
        <select class="form-input" required [(ngModel)]="voluntario.disponibilidad" name="disponibilidad">
          <option value="" disabled selected>Seleccione disponibilidad</option>
          <option value="Mañana">Mañana</option>
          <option value="Tarde">Tarde</option>
          <option value="Completa">Completa</option>
        </select>
        <span class="select-arrow"><i class="fas fa-chevron-down"></i></span>
      </div>
    </div>

    <!-- Grupo URL de Imagen -->
    <div class="form-group">
      <label class="form-label">URL de Imagen</label>
      <input type="text" class="form-input" [(ngModel)]="voluntario.imagenUrl" name="imagenUrl" 
             placeholder="https://ejemplo.com/imagen.jpg" />
      <span class="input-icon"><i class="fas fa-image"></i></span>
    </div>

    <!-- Grupo Refugio -->
    <div class="form-group">
      <label class="form-label">Refugio Asociado</label>
      <div class="select-wrapper">
        <select class="form-input" required [(ngModel)]="voluntario.id_refugio" name="id_refugio">
          <option value="" disabled selected>Seleccione el refugio</option>
          <option *ngFor="let refugio of refugios | async" [value]="refugio.id">{{refugio.nombre}}</option>
        </select>
        <span class="select-arrow"><i class="fas fa-chevron-down"></i></span>
      </div>
    </div>

    <!-- Botón de Envío -->
    <button type="submit" class="submit-btn" [disabled]="!formVoluntario.form.valid">
      <i [class]="btnEnvEdit.icon"></i> {{btnEnvEdit.mensaje}}
    </button>
  </form>
</div>
