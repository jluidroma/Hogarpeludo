<header class="header">
  <div class="header-container">
    <div class="logo" [routerLink]="['/']">
      <img src="./images/logo.png" alt="Hogar Peludo Logo" />
      <span class="logo-text">Hogar Peludo</span>
    </div>
    <nav class="navbar">
      <ul class="nav-links">
        <li><a href="/">Inicio</a></li>
        <li><a href="/mascotas">Adopciones</a></li>
        <li *ngIf="authService.isAdmin()"><a href="/mascotas">solicitudes</a></li>
        <li><a href="/voluntarios">voluntarios</a></li>
        <li ><a href="/refugios">refugios</a></li>
        <li *ngIf="authService.isAdmin()"><a href="/usuarios">Usuarios</a></li>
        <li *ngIf="!authService.isLoggedIn()"><a href="/registro" class="btn">Regístrate</a></li>
        <li *ngIf="!authService.isLoggedIn()"><a href="/login" class="btn">Ingresar</a></li>
      </ul>
    </nav>
    <!-- Menú de usuario en esquina superior derecha -->
    <div class="perfil-container"*ngIf="authService.isLoggedIn()">
      <div class="perfil-circulo" (click)="toggleDropdown()">U</div>
      <div class="perfil-dropdown" *ngIf="dropdownVisible">
        <div class="estado">
          <div class="bolita"></div>
          <span>En línea</span>
           </div>
        <button (click)="cerrarsesion()" class="cerrar-sesion">Cerrar sesión</button>
      </div>
    </div>

</div>
</header>
