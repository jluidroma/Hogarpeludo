<div class="max-w-3xl mx-auto mt-10 p-6 bg-white rounded-2xl shadow-xl">
  <h2 class="text-3xl font-bold text-center text-indigo-600 mb-6">Editar Usuario</h2>

  <form (ngSubmit)="onSubmit()" #formRef="ngForm" class="space-y-5">
    <!-- Email (solo lectura) -->
    <div>
      <label class="block font-semibold mb-1">Correo electrónico</label>
      <input
        type="email"
        class="w-full border rounded-xl px-4 py-2 bg-gray-100"
        [value]="usuario.email"
        readonly
        name="email"
      />
    </div>

    <!-- Nombre Completo -->
    <div>
      <label class="block font-semibold mb-1">Nombre Completo</label>
      <input
        type="text"
        class="w-full border rounded-xl px-4 py-2"
        required
        [(ngModel)]="usuario.nombreCompleto"
        name="nombreCompleto"
      />
    </div>

    <!-- Teléfono -->
    <div>
      <label class="block font-semibold mb-1">Teléfono</label>
      <input
        type="tel"
        class="w-full border rounded-xl px-4 py-2"
        [(ngModel)]="usuario.telefono"
        name="telefono"
      />
    </div>

    <!-- Dirección -->
    <div>
      <label class="block font-semibold mb-1">Dirección</label>
      <input
        type="text"
        class="w-full border rounded-xl px-4 py-2"
        [(ngModel)]="usuario.direccion"
        name="direccion"
      />
    </div>

    <!-- Rol del usuario -->
    <div>
      <label class="block font-semibold mb-1">Rol</label>
      <select
        class="w-full border rounded-xl px-4 py-2"
        [(ngModel)]="usuario.rol"
        name="rol"
        required
      >
        <option value="admin">Administrador</option>
        <option value="cliente">Cliente</option>
        <option value="veterinario">Veterinario</option>
      </select>
    </div>

    <!-- Botones -->
    <div class="flex space-x-4">
      <button
        type="submit"
        class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-xl flex-1"
      >
        Guardar Cambios
      </button>
      
      <button
        type="button"
        (click)="cancelar()"
        class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded-xl flex-1"
      >
        Cancelar
      </button>
    </div>
  </form>
</div>
